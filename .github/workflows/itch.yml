# a release published on github goes to itch.io too: its installer, pushed with butler to the windows channel of
# loiclaudet/1up, under the release's version. butler logs in with the repo secret BUTLER_API_KEY (itch.io,
# settings, api keys). for a release published before this workflow existed, run it by hand with that release's tag
name: itch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the release to push, like v0.1.0
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: the installer, from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir itch
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 1up-setup.exe --dir itch
          ls -la itch
      # broth's url always serves the latest stable butler
      - name: butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: push
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler/butler push itch loiclaudet/1up:windows --userversion "${TAG#v}"
