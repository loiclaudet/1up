# every push and pull request: the tests on windows and on a mac, and the windows installer built on a real windows
# machine (msvc and cmake native, for sdl), then installed and started there. a v* tag also makes a draft release
# with the installer, under a name that never changes (1up-setup.exe), so the readme can link the latest one
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # the tests, then the installer, then what someone who downloads it gets: one windows runner does it all, so the
  # build never waits on a mac
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # the rust side embeds the built page: built first
      - run: pnpm build
      # the driver's installer, which 1up's installer carries: fetched, its signature and hash checked
      - run: ./src-tauri/windows/fetch-driver.ps1
        shell: pwsh
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # with the update key (the repo secret), the installer is signed for 1up's updater; without it (a fork's pull
      # request) it is built the same, unsigned
      - name: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            pnpm tauri build --bundles nsis
          fi
      # a tag's release also carries latest.json, what every installed 1up asks at launch: the version, and where
      # the signed installer is
      - name: gather
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/1up-setup.exe
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sig=$(cat src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
            jq -n --arg version "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg signature "$sig" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/1up-setup.exe" \
              '{version: $version, notes: "", pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
              > out/latest.json
            cat out/latest.json
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: 1up-windows
          path: out/
      # the download, as someone runs it (silent here): 1up in their apps, and the driver installed by it
      - name: install
        shell: pwsh
        run: |
          $p = Start-Process out/1up-setup.exe -ArgumentList '/S' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          Get-ChildItem "$env:LOCALAPPDATA\1up" -Recurse | Select-Object FullName, Length
          if (-not (Test-Path "$env:LOCALAPPDATA\1up\1up.exe")) { throw '1up was not installed' }
          sc.exe query ViGEmBus
          if (-not (Test-Path HKLM:\SYSTEM\CurrentControlSet\Services\ViGEmBus)) { throw 'the driver was not installed' }
      # 1up as installed: it starts, SDL comes up on its thread, the driver answers, it writes its log
      - name: smoke
        shell: pwsh
        run: |
          $app = Start-Process "$env:LOCALAPPDATA\1up\1up.exe" -PassThru
          Start-Sleep -Seconds 12
          $logs = "$env:LOCALAPPDATA\com.loiclaudet.oneup\logs"
          Get-ChildItem $logs
          $log = Get-ChildItem $logs -Filter *.log | Select-Object -First 1
          Get-Content $log.FullName
          Stop-Process -Id $app.Id -Force
          if (-not (Select-String -Path $log.FullName -Pattern 'sdl: up' -Quiet)) { throw 'sdl did not come up' }
          if (-not (Select-String -Path $log.FullName -Pattern 'vigembus: ready' -Quiet)) { throw 'the driver did not answer' }
      # a real virtual xbox pad, on the driver 1up's installer put there: the ignored test plugs one in and reads it
      # back through xinput
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture

  # lodz's mac, where 1up is developed: the tests and the page's build
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: 1up-windows
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft --title "1up $GITHUB_REF_NAME" --notes "1up $GITHUB_REF_NAME"
