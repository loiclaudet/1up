# every push and pull request: the tests on windows and on a mac, and the windows app built on a real windows
# machine (msvc and cmake native, for sdl). a v* tag also makes a draft release with the installer and the bare exe
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # the tests, then the app: one windows runner does both, so the build never waits on a mac
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # the rust side embeds the built page: built first
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --bundles nsis
      # the app itself on windows: it starts, SDL comes up on its thread, it writes its log
      - name: smoke
        shell: pwsh
        run: |
          $app = Start-Process src-tauri/target/release/oneup.exe -PassThru
          Start-Sleep -Seconds 12
          $logs = "$env:LOCALAPPDATA\com.loiclaudet.oneup\logs"
          Get-ChildItem $logs
          $log = Get-ChildItem $logs -Filter *.log | Select-Object -First 1
          Get-Content $log.FullName
          Stop-Process -Id $app.Id -Force
          if (-not (Select-String -Path $log.FullName -Pattern 'sdl: up' -Quiet)) { throw 'sdl did not come up' }
      - name: gather
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/oneup.exe out/1up-portable.exe
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: 1up-windows
          path: out/

  # a real virtual xbox pad: vigembus installed on the runner (its installer's signature checked first), then the
  # ignored test plugs a pad and reads it back through xinput
  xbox-pad:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: vigembus
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile vigembus.exe
          $sig = Get-AuthenticodeSignature ./vigembus.exe
          "signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Nefarius') { throw 'not the signed vigembus installer' }
          $p = Start-Process ./vigembus.exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --nocapture

  # lodz's mac, where 1up is developed: the tests and the page's build
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: 1up-windows
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft --title "1up $GITHUB_REF_NAME" --notes "1up $GITHUB_REF_NAME"
