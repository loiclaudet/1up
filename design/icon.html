<!doctype html>
<!-- 1up's icon, 1024 px: the wordmark in the live lime on the ink. rendered with headless chromium into
     design/icon.png (the tile re-centred on a transparent 1024 square), then `pnpm tauri icon design/icon.png`
     makes every size in src-tauri/icons -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Darker Grotesque';
        src: url('../node_modules/@fontsource-variable/darker-grotesque/files/darker-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 300 900;
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        position: relative;
        background: transparent;
      }
      .tile {
        position: absolute;
        inset: 64px;
        display: grid;
        place-items: center;
        border-radius: 200px;
        background:
          radial-gradient(120% 90% at 30% 15%, oklch(0.3 0.02 125), transparent 60%),
          oklch(0.2 0.016 125);
        box-shadow: inset 0 0 0 6px oklch(0.32 0.02 125);
      }
      .mark {
        margin-top: -70px;
        font: 900 470px/1 'Darker Grotesque', sans-serif;
        letter-spacing: -0.04em;
        color: oklch(0.9 0.19 124);
      }
    </style>
  </head>
  <body>
    <div class="tile"><span class="mark">1up</span></div>
  </body>
</html>
