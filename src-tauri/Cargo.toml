[package]
name = "oneup"
version = "0.1.0"
description = "1up: turns nintendo pads into xbox pads on windows"
authors = ["Loïc Laudet"]
license = "MIT"
repository = "https://github.com/loiclaudet/1up"
edition = "2024"
rust-version = "1.90"

[lib]
name = "oneup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-joystick", "sdl-hidapi"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

[target."cfg(windows)".dependencies]
vigem-client = "0.1.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_Shell"] }
